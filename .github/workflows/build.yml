name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Integration branches (e.g. feat/storefront-clearnet-vpn) collect
    # stacked PRs before they reach main; each PR must pass CI first.
    branches: ['main', 'feat/**']
    paths-ignore: ['*.md']

permissions: {}

concurrency:
  group: package-build-${{ github.event.action == 'edited' && !github.event.changes.base && format('metadata-{0}', github.event.pull_request.number) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit & Integration Tests
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # bridge.py derives WireGuard keys with `wg`, as in the Docker image
      # (alpine + wireguard-tools); the Python suite runs that real path.
      - name: Install WireGuard tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends wireguard-tools

      - name: Run complete test suite
        run: npm run test:all

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      # Same SDK lint the Start9 package build (s9pk.mk) runs; fails here
      # in seconds instead of minutes into the package build.
      - name: Lint (Start9 SDK rules)
        run: npm run lint

  build:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    # No DEV_KEY — a PR build doesn't publish, so it doesn't need the signing key.
