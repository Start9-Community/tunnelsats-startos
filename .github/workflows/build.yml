name: Build StartOS Package

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches:
      - main
      # Integration branches (e.g. feat/storefront-clearnet-vpn) collect
      # stacked PRs before they reach main; each PR must pass CI first.
      # PR-only on purpose: a push trigger would run the suite twice when
      # the integration branch itself has an open PR to main.
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # bridge.py derives WireGuard keys with `wg`, as in the Docker image
      # (alpine + wireguard-tools); the Python suite runs that real path.
      - name: Install WireGuard tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends wireguard-tools

      - name: Run complete test suite
        run: npm run test:all

      - name: TypeScript typecheck
        run: npm run check

      # Same SDK lint the Start9 package build (s9pk.mk) runs; fails here
      # in seconds instead of minutes into the package build.
      - name: Lint (Start9 SDK rules)
        run: npm run lint

  build:
    name: Build StartOS Package
    needs: test
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@ead412242eec62379eb68cc84db1155fcade10a8 # master
