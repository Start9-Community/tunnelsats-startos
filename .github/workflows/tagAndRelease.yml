name: Tag and Release

# Manual only until launch. On push to main this workflow force-moves the
# version tag and rebuilds the GitHub release whenever the manifest version
# is not on the community registry yet, which would publish the unreleased
# storefront package as the "Latest" download. Restore the push trigger
# (branches: [main]) once the launch gates in README.md are cleared and the
# package version has been bumped past the legacy 0.4.0:5 release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Tag and Release
    uses: Start9Labs/start-technologies/.github/workflows/tagAndRelease.yml@ead412242eec62379eb68cc84db1155fcade10a8 # master
    with:
      REFERENCE_REGISTRY: 'https://community-registry.start9.com'
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY || secrets.STARTOS_DEVELOPER_KEY }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
